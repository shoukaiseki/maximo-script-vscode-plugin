# 快捷插入代码配置
# 自定义文件位置: ~/.sks/maximo-script-helper/quick-code目录下,会扫描所有yml/yaml文件
#            目录下会按照文件名加载配置
# 代码块使用 | 或 |- 保留换行格式

# 当前模板中使用的变量和描述
tmplenv:
  objectName: 
    desc: "对象名称"
    remark: "例如ITEM"
  attributeName:
    desc: "属性名称"
    remark: "例如ITEMNUM"


