                        <tablebody displayrowsperpage="10" filterable="true" id="lookup_item_tablebody">
                          <tablecol filterable="false" id="lookup_item_col1" mxevent="toggledetailstate" mxevent_desc="显示详细信息" sortable="false" type="event"/>
                          <tablecol dataattribute="ITEMNUM" mxevent_desc="转到%1" id="lookup_item_col2" linkedcontrolid="lookup_item_detail_1" type="link" sortable="true" mxevent="selectrecord"/>
                          <tablecol dataattribute="DESCRIPTION" mxevent_desc="转到%1" id="lookup_item_col3" linkedcontrolid="lookup_item_detail_2" type="link" sortable="true" mxevent="selectrecord"/>
                        </tablebody>
                        <tabledetails id="lookup_item_details">
                          <section id="lookup_item_detail_sec" label="详细信息">
                            <sectionrow id="lookup_item_detail_row">
                              <sectioncol id="lookup_item_detail_col1">
                                <section id="lookup_item_detail_sec1">
                                  <textbox dataattribute="ITEMNUM" id="lookup_item_detail_1" inputmode="readonly"/>
                                  <textbox dataattribute="DESCRIPTION" id="lookup_item_detail_2" inputmode="readonly"/>
                                </section>
                              </sectioncol>
                            </sectionrow>
                          </section>
                        </tabledetails>
                      </table>
                      <buttongroup id="lookup_item_buttons">
                        <pushbutton default="true" id="lookup_ok_btn" label="确定" mxevent="dialogok"/>
                        <pushbutton id="lookup_cancel_btn" label="取消" mxevent="dialogcancel"/>
                      </buttongroup>
                    </dialog>
  - name: "颜色规则"
    childrens:
      - name: displayrule颜色显示规则
        childrens:
          - name: 精确匹配(exact)
            componentName: "displayrule"
            remark: |
              颜色显示规则,放在</tablebody>前面
              常用颜色: purple(紫色),blue(蓝色),gold(金色),red(红色),green(绿色),orange(橙色),gray(灰色)
            code: |
                    <displayrule dataattribute="STATUS" id="displayrule1">
                      <exact id="exact1" value="新建" classname="purple"/>
                      <exact id="exact2" value="已批准" classname="blue"/>
                      <exact id="exact3" value="待审批" classname="gold"/>
                      <exact id="exact4" value="已拒绝" classname="red"/>
                    </displayrule>
          - name: 范围匹配(range)
            componentName: "displayrule"
            remark: "范围匹配(仅对int类型有效)"
            code: |
                    <displayrule dataattribute="PRIORITY" id="displayrule2">
                      <range classname="rowcolor_priority_high" id="range1" lower="1" upper="3"/>
                      <range classname="rowcolor_priority_medium" id="range2" lower="4" upper="6"/>
                      <range classname="rowcolor_priority_low" id="range3" lower="7" upper="10"/>
                    </displayrule>
  - name: "其它"
    childrens:
      - name: 缺省值
        childrens:
          - name: defaultvalue
            componentName: "defaultvalue"
            remark: |
              缺省值,通常放在table里面或者tab中
            code: |
                  <!--
                  <defaultvalue
                  id="控制标识"
                  dataattribute="属性"
                  value="值"
                  fromdatasrc="原数据标识-主表的数据源标识。mainrecord 主表"
                  fromattribute="来自属性"
                  defaulttype="缺省类型:INSERT(插入),QUERY(查询)"
                  sigoption="签名选项"
                  sigoptiondatasrc="签名数据源标识"/>
                  -->
                  <defaultvalue dataattribute="属性" value="值" fromattribute="来自属性" defaulttype="INSERT" id="section_xml_defaultvalue_1"/>

# MAXOBJECT导入配置json
maxobjectjson:
  - name: "导入MAXOBJECT配置json"
    childrens:
      - name:  MAXOBJECT
        childrens:
          - name: sameAs等同对象
            remark: "MAXOBJECT配置json中的 sameAsObject和sameAsAttribute属性,设置之后将忽略length和scale属性(不支持变更字段长度)"
            code: |
                "sameAsObject": "${objectName}","sameAsAttribute": "${attributeName}",
