# 快捷插入代码配置
# 文件位置: ~/.sks/maximo-script-helper/quick-code.yaml
# 代码块使用 | 或 |- 保留换行格式

# 当前模板中使用的变量和描述
tmplenv:
  objectName: 
    desc: "对象名称"
    remark: "例如ITEM"
  attributeName:
    desc: "属性名称"
    remark: "例如ITEMNUM"


#自动化脚本(js)插入
javascript:
  - name: "SKS_LOG_ANSI_UTILS通用工具"
    childrens:
      - name: getErrorStackTrace获取错误堆栈跟踪
        remark: "通过error获取错误堆栈跟踪"
        code: |
          var sksLogAnsiUtils = service.invokeScript("SKS_LOG_ANSI_UTILS");
          /** @type {java.lang.String} */
          var errorMessage = sksLogAnsiUtils.getErrorStackTrace(error)
      - name: "logger代理 sksLogAnsiUtils.newAnsiLogger"
        remark: |
          logger输出linux终端显示高亮
          注意:不要用于对象init和字段init脚本中,会影响执行效率
        code: |
          /** @type {org.apache.log4j.Level} */
          Level = Java.type("org.apache.log4j.Level");
          /** @type {psdi.util.logging.MXLoggerFactory} */
          MXLoggerFactory = Java.type("psdi.util.logging.MXLoggerFactory");
          /** @type {psdi.util.logging.MXLogger} */
          var loggerMX = MXLoggerFactory.getLogger("maximo.script." + scriptName);
          var sksLogAnsiUtils = service.invokeScript("SKS_LOG_ANSI_UTILS");
          /** @type {psdi.util.logging.MXLogger} */
          var logger = sksLogAnsiUtils.newAnsiLogger({ logger: loggerMX, ansiOpen: true })
  - name: "SKS_COMMONS_UTILS通用工具"
    childrens:
      - name: "getAppNameByMbo 获取appName"
        remark: "通过mbo获取appName"
        code: |
          /** @type {java.lang.String} */
          var appName = service.invokeScript("COMMON.UTILS", "getAppNameByMbo", [mbo]);
      - name: "trimAll 清除字符串前后空格及特殊空白字符"
        remark: "除常规空白字符(空格/制表符/换行等)外，还会清除中文全角空格(\\u3000),不间断空格(\\u00A0)等 Unicode 空白字符。"
        code: |
          /** @type {java.lang.String} */
          var str = service.invokeScript("COMMON.UTILS", "trimAll", [itemnum]);
      - name: printComponentInfo 遍历打印组件信息
        remark: "遍历打印组件信息,用于调试"
        code: |
          var sksCommonsUtils = service.invokeScript("SKS_COMMONS_UTILS");
          var cont = appBean ? appBean.getCreator() : null;
          /** @type {java.util.List} */
          var componentInfo = sksCommonsUtils.printComponentInfo(cont, "-")
      - name: findComponentFromApp 遍历查找组件
        remark: "遍历查找组件"
        code: |
          var sksCommonsUtils = service.invokeScript("SKS_COMMONS_UTILS");
          //我这里id是按钮的id,所以直接用pushbutton作为变量
          var pushbutton = sksCommonsUtils.findComponentFromApp(appInstance,"1780382003239");
          logger.info("[" + scriptName + "] pushbutton=" + pushbutton);
          if (pushbutton) {
            logger.info("[" + scriptName + "] pushbutton=" + pushbutton.getClass());
            // pushbutton.render()
            // pushbutton.sigOptionCheckForLookups();
            // pushbutton.setProperty("label", "213");
          }
  - name: "脚本初始化常用方法(初始化方法最好不要调用其它脚本,会影响页面加载速度)"
    childrens:
      - name: "获取appName"
        remark: "子级的情况下获取真实appName,默认最多获取5层父级"
        code: |
          /**
          * 获取应用名称,通常用于子表获取appName
          var appName = service.invokeScript("COMMON.UTILS", "getAppNameByMbo", [mbo]);
          * @param {*} mbo
          * @param {*} frequency
          * @returns
          */
          function getAppNameByMbo(mbo, frequency) {
              // 防止无限递归，设置最大递归深度
              var maxDepth = 5;
              var currentDepth = (frequency === undefined || frequency == null) ? 0 : frequency;

              if (currentDepth >= maxDepth) {
                  return null;
              }

              if (mbo == null) {
                  return null;
              }

              // 获取当前MBO的应用名称
              var app = mbo.getThisMboSet().getApp();

              // 如果当前应用名称有效，直接返回
              if (app != null && app !== "") {
                  return app;
              }

              // 如果当前没有应用名称，尝试从父级获取
              var parent = mbo.getOwner();
              if (parent != null) {
                  // 递归调用，深度+1
                  return getAppNameByMbo(parent, currentDepth + 1);
              }

              // 没有父级且当前也没有应用名称，返回null
              return null;
          }
      - name: "service.log_debug linux终端ANSI高亮\x1b[34m]"
        remark: "service.log日志输出"
        code: |
          service.log_debug("\x1b[34m[" + scriptName + "]-------------" + ""+"\x1b[0m")
      - name: "service.log_info linux终端ANSI高亮\x1b[32m"
        remark: "service.log日志输出"
        code: |
          service.log_info("\x1b[32m[" + scriptName + "]-------------" + ""+"\x1b[0m")
      - name: "service.log_warn linux终端ANSI高亮\x1b[33m"
        remark: "service.log日志输出"
        code: |
          service.log_warn("\x1b[33m[" + scriptName + "]-------------" + ""+"\x1b[0m")
      - name: "service.log_error linux终端ANSI高亮\x1b[31m"
        remark: "service.log日志输出"
        code: |
          service.log_error("\x1b[31m[" + scriptName + "]-------------" + ""+"\x1b[0m")

  - name: "java常用方法"
    childrens:
      - name: "刷新页面"
        remark: "appBean/dataBean层面刷新页面"
        code: |
          //appBean/dataBean层面刷新页面
          appBean.reloadTable()
          appBean.refreshTable();
          appBean.fireChildChangedEvent();
          appBean.fireStructureChangedEvent();			//刷新方法

#应用程序设计器xml
maxappxml:
  - name: "组件属性"
    childrens:
      - name: presentation组件
        childrens:
          - name: keyattribute属性
            componentName: "presentation"
            remark: |
              例如:设置为 WONUM [7.1:选择操作左边的查找框以WONUM为精确查找字段]
                               [9.1:右上角工具栏按钮最左边精确查找框以WONUM为精确查找字段]
            code: "keyattribute"
      - name: textbox文本框组件
        childrens:
          - name: textbox组件属性说明
            componentName: "textbox"
            remark: "文本框"
            code: |
                    <!--<textbox dataattribute="SOURCE" id="1778174194703" applinkkey="转到应用时候,当前表对应目标应用主键的属性" /> -->
                    <textbox dataattribute="SOURCE" id="1778174194703" applinkkey="ITEMNUM" /> 
      - name: multilinetextbox多行文本框组件
        childrens:
          - name: 多行文本框组件
            componentName: "multilinetextbox"
            remark: "多行文本框"
            code: |
                    <!--<multilinetextbox dataattribute="SOURCE" id="1778174194703" rows="行数" span="列数"/> -->
                    <multilinetextbox dataattribute="SOURCE" id="1778174194703" rows="40" span="80"/>
      - name: multiparttextbox多部分文本框组件
        childrens:
          - name: 多部分文本框组件
            componentName: "multiparttextbox"
            remark: "多部分文本框"
            code: |
                  <!-- <multiparttextbox
                      id="多部分文本框" 
                      label="标签" 
                      dataattribute="属性"
                      lookup="查找"
                      inputmode="输入方式:DEFAULT(缺省),PASSWORD(密码),PASSWORDREADONLY(只读密码),PASSWORDREQUIRED(需要密码),QUERY(查询),READONLY(只读),REQUIRED(必需)" 
                      ondatachange="变更事件:REFRESHTABLE(刷新表),RESETCHILDREN(复位子表)"
                      smartfilloff="关闭只能填充:false,true" 
                      applink="转到应用程序"
                            "移动到数据源标识(不能用)"
                      descdataattribute="部件2的属性"
                      desclookup="查找部件2"
                      descinputmode="部件2的输入方式:DEFAULT(缺省),PASSWORD(密码),PASSWORDREADONLY(只读密码),PASSWORDREQUIRED(需要密码),QUERY(查询),READONLY(只读),REQUIRED(必需)"
                      longdescreadonly="只读详细描述:false,true" 
                      datasrc="数据源标识"
                      sigoption="签名选项" 
                      size="宽度"
                      sigoptiondatasrc="签名数据源标识"/>
                      -->
                    <multiparttextbox dataattribute="ORDERUNIT" descdataattribute="MEASUREUNIT_ORDERUNIT.DESCRIPTION" descinputmode="readonly" id="1780329548595" inputmode="required" label="计量单位(采购)" lookup="measureunit" size="10"/>

# MAXOBJECT导入配置json
maxobjectjson:
  - name: "导入MAXOBJECT配置json"
    childrens:
      - name:  MAXOBJECT
        childrens:
          - name: sameAs等同对象
            remark: "MAXOBJECT配置json中的 sameAsObject和sameAsAttribute属性,设置之后将忽略length和scale属性(不支持变更字段长度)"
            code: |
                "sameAsObject": "${objectName}","sameAsAttribute": "${attributeName}",
