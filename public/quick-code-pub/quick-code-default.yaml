            remark: |
              例如:设置为 WONUM [7.1:选择操作左边的查找框以WONUM为精确查找字段]
                               [9.1:右上角工具栏按钮最左边精确查找框以WONUM为精确查找字段]
            code: "keyattribute"
      - name: textbox文本框组件
        childrens:
          - name: textbox组件属性说明
            componentName: "textbox"
            remark: "文本框"
            code: |
                  <!-- <textbox
                      id="唯一标识"
                      label="显示标签"
                      hidelabel="隐藏标签:false,true"
                      dataattribute="绑定字段"
                      menutype="菜单类型:item,normal"
                      lookup="查找对话框名称"
                      detailimage="详细信息图像"
                      inputmode="输入方式:DEFAULT(缺省),PASSWORD(密码),PASSWORDREADONLY(只读密码),PASSWORDREQUIRED(需要密码),QUERY(查询),READONLY(只读),REQUIRED(必需)"
                      prepend="QBE预先考虑"
                      ondatachange="变更事件:REFRESHTABLE(刷新表),RESETCHILDREN(复位子表)"
                      smartfilloff="关闭智能填充:false,true"
                      longdescreadonly="只读详细描述:false,true"
                      applink="转到应用程序"
                      displaytype="显示类型"
                      datasrc="数据源标识"
                      sigoption="签名选项"
                      sigoptiondatasrc="签名数据源标识"
                      required="是否必填:true,false"
                      width="宽度"
                      cssclass="CSS类名"
                      applinkkey="转到应用时候,当前表对应目标应用主键的属性"/>
